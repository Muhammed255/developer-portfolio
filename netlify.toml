# Netlify config, kept for the transition to AWS (see infra/template.yaml).
[build]
  publish = "dist/developer-portfolio/browser"
  command = "yarn build"

[build.environment]
  NODE_VERSION = "22"
  YARN_FLAGS = "--frozen-lockfile"

# Pages are prerendered to <route>/index.html, which Netlify serves directly.
# Anything else falls back to the client-rendered shell (shows the 404 page).
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

# The blog was removed; send old links home.
[[redirects]]
  from = "/blog"
  to = "/"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.csr.html"
  status = 404

# Inline scripts are restricted per page by the CSP <meta> tag added by
# scripts/csp-hashes.mjs; both policies are enforced.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://so4ac1fs4a.execute-api.eu-central-1.amazonaws.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Hashed build output never changes, so cache it for a year.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
